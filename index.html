<style>
:root{

  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101513;--surface:#182019;--fg:#E7EEEA;--muted:#9AA9A2;--line:#2A3530;--accent:#FF8077;--accent-ink:#1A0806;--ok:#4FC08A;--ok-ink:#06150D;--chip:#222C28;--warn:#F2C26B;--warn-bg:#3A2D12;--err-bg:#3B1B18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101513;--surface:#182019;--fg:#E7EEEA;--muted:#9AA9A2;--line:#2A3530;--accent:#FF8077;--accent-ink:#1A0806;--ok:#4FC08A;--ok-ink:#06150D;--chip:#222C28;--warn:#F2C26B;--warn-bg:#3A2D12;--err-bg:#3B1B18;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:3px double var(--accent);padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:1.15rem;line-height:1.25;font-weight:700}
.top .shop{font-size:.78rem;color:var(--muted)}
.wrap{max-width:820px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:transparent;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.74rem;color:var(--muted);min-height:var(--nav-h)}
.nav button .ic{font-size:1.4rem;line-height:1.1}
.nav button[aria-current="page"]{color:var(--ok);font-weight:600}
.nav button[aria-current="page"] .ic{transform:translateY(-1px)}
h2{font-size:1.1rem;margin:18px 0 8px;font-weight:700}
h3{font-size:1rem;margin:12px 0 6px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(min-width:620px){.g3m{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .l{font-size:.8rem;color:var(--muted)}
.stat .v{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat.ok .v{color:var(--ok)}.stat.bad .v{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 14px;font-weight:500;min-height:44px}
.btn.primary{background:var(--ok);color:var(--ok-ink);border-color:var(--ok);font-weight:600}
.btn.red{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:.88rem;border-radius:8px}
.btn.big{min-height:60px;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.btn[disabled]{opacity:.5;cursor:default}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:5px 13px;font-size:.9rem;min-height:34px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=text],input[type=search],input[type=tel],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:1rem}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok)}
textarea{min-height:5em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.f{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);min-width:0}
.f>input,.f>select,.f>textarea{color:var(--fg)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
.msg{min-height:1.3em;font-size:.92rem;overflow-wrap:anywhere}
.msg.ok{color:var(--ok)}.msg.err{color:var(--accent)}
.banner{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:.93rem}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--err-bg);color:var(--accent)}
.banner.ok{background:var(--chip);color:var(--ok)}
.banner .btn{margin-top:6px}
.list{display:flex;flex-direction:column}
.item{border-bottom:1px dotted var(--line);padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.item .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.item.void{opacity:.55}.item.void .t{text-decoration:line-through}
.tag{display:inline-block;font-size:.72rem;border-radius:6px;padding:0 6px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.red{background:var(--err-bg);color:var(--accent)}.tag.green{background:var(--chip);color:var(--ok)}.tag.amber{background:var(--warn-bg);color:var(--warn)}
.pos{color:var(--ok)}.neg{color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.tabs .chip{white-space:nowrap}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.sheet.full{height:94vh}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
.sheet-h h2{margin:0}
.x{border:0;background:var(--chip);border-radius:999px;width:38px;height:38px;font-size:1.2rem}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.menu button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.menu .ic{font-size:1.6rem}
.cat{border-top:1px solid var(--line)}
.cat:last-of-type{border-bottom:1px solid var(--line)}
.cat>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;cursor:pointer}
.cat>summary::-webkit-details-marker{display:none}
.cn{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.cn::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details[open]>summary .cn::before{transform:rotate(45deg)}
.cs{display:flex;flex-direction:column;align-items:flex-end;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prow{border-bottom:1px dotted var(--line);padding:8px 0}
.pline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;cursor:pointer;min-width:0}
.nm{display:block;font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.meta{display:block;font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.prow:not(.on) .rt b{color:var(--muted);font-weight:400}
.panel{margin-top:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.calc{font-size:.88rem;background:var(--chip);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:var(--top-h,56px);z-index:15;background:var(--bg);border-bottom:3px double var(--accent);padding:8px 0}
.track{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);transition:width .25s}
.over .fill{background:var(--accent)}
.total{font-weight:700;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.big-total{font-size:1.5rem;font-weight:700}

.qty{display:flex;align-items:center;gap:4px}

.qty input{text-align:center;min-width:0}
.pickrow{display:flex;justify-content:space-between;gap:8px;padding:9px 4px;border-bottom:1px dotted var(--line);cursor:pointer;align-items:center}
.pickrow:active{background:var(--chip)}
.empty{padding:22px 0;text-align:center;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:11px 8px;min-height:44px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ok);color:var(--ok-ink);font-weight:700}
.seg button.red[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:.78rem;color:var(--muted);font-weight:600}
table.t td.n,table.t th.n{text-align:right}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:80;max-width:90vw;font-size:.92rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.offline{display:none;background:var(--warn-bg);color:var(--warn);font-size:.8rem;padding:2px 10px;text-align:center}
.offline.on{display:block}

/* ---- রসিদ ও প্রিন্ট ---- */
.receipt{background:#fff;color:#111;border:1px dashed #999;border-radius:8px;padding:14px;max-width:380px;margin:8px auto;font-size:14px;line-height:1.45}
.receipt h4{margin:0;text-align:center;font-size:1.15rem}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #888;margin:8px 0}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:2px 0;vertical-align:top}
.receipt td.n{text-align:right;white-space:nowrap}
.receipt .tot td{font-weight:700}
.receipt .v{color:#B3261E;font-weight:700;text-align:center}
.sheetdoc{background:#fff;color:#111;font-size:13px;line-height:1.45;padding:4px}
.sheetdoc h3{margin:0 0 2px;font-size:1.25rem}
.sheetdoc table{width:100%;border-collapse:collapse;margin:6px 0}
.sheetdoc th,.sheetdoc td{border:1px solid #bbb;padding:4px 6px;text-align:left}
.sheetdoc th{background:#eee}
.sheetdoc td.n,.sheetdoc th.n{text-align:right;white-space:nowrap}
.sheetdoc .cat-h td{background:#f3f3f3;font-weight:700}
.sheetdoc .grand td{font-weight:700;font-size:1.05em}
.sheetdoc .sub{color:#444;margin:0 0 8px}
#printArea{display:none}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing{background:#fff!important;padding:0!important;color:#000}
  body.printing #printArea{display:block!important}
  #printArea .receipt{border:0;max-width:none;margin:0;padding:0}
  #printArea .sheetdoc{padding:0}
  #printArea tr{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function ensureCatalogExpansion() {
  const existing = new Set(C.products.map(p => p.cat + '||' + p.name));
  const oldCats = new Set(C.cats.map(c => c.name)); const add = [];
  CATALOG_EXPANSION.forEach((x, i) => { const [cat,subcat,brand,name,unit]=x; if(existing.has(cat+'||'+name)) return;
    const p=newProduct({id:'catalogv2_'+i,name,cat,unit,q:1,b:0,s:0,pri:2,on:false,d:0,ord:50000+i});
    p.subcat=subcat; p.brand=brand; p.image=''; add.push(p); existing.add(cat+'||'+name);
  });
  const newCats=['পানি','কোল্ড ড্রিংকস','চিপস ও স্ন্যাকস','বিস্কুট ও বেকারি','চকলেট ও ক্যান্ডি','প্লাস্টিক সামগ্রী','চা ও কফি','নিত্যপ্রয়োজনীয়'];
  const missing=newCats.filter(n=>!oldCats.has(n)); if(!add.length&&!missing.length)return;
  missing.forEach(name=>C.cats.push({name,note:''}));
  await run(['products','meta','audit'],'readwrite',async h=>{for(const p of add)await h.put('products',p);await h.put('meta',{k:'cats',v:C.cats});await audit(h,'নতুন পণ্য ক্যাটালগ যোগ','',add.length+'টি প্রাথমিক পণ্য যোগ হয়েছে; পুরোনো ডেটা অক্ষত');await bump(h);});
}

    const reader = new FileReader(); reader.onload = () => resolve(String(reader.result || '')); reader.onerror = () => reject(new Error('ছবি পড়া যায়নি।')); reader.readAsDataURL(file);

}
function defaultAlt(unit) {

}

function seedProducts() {
  const cats = [], items = []; let n = 0; const oid = {};
  SEED_DATA.trim().split('\n').forEach(line => {
    line = line.trim(); if (!line) return;
    const p = line.split('|');
    if (line[0] === '#') { cats.push({ name: p[0].slice(1).trim(), note: (p[1] || '').trim(), k: 0 }); return; }
    const c = cats[cats.length - 1];
    const m = toEn(p[1]).trim().match(/^([\d.]+)\s*(.*)$/);
    let q = m ? parseFloat(m[1]) : 1, u = m ? m[2].trim() : p[1];
    const total = +p[2];
    if (u === 'গ্রাম' && q >= 100) { q = q / 1000; u = 'কেজি'; }
    const it = newProduct({ id: 'seed' + (++n), name: p[0], cat: c.name, unit: u, q: q, b: r2(total / q), s: 0, pri: +p[3], on: false, ord: n });
    oid[(cats.length - 1) + '-' + (c.k++)] = it.id;

}
function autoSelect(budget) {
  const order = C.products.filter(p => p.active !== false).map((p, i) => ({ p, i })).sort((a, b) => a.p.pri - b.p.pri || a.i - b.i);
  let sum = 0;
  C.products.forEach(p => { p.on = false; });
  order.forEach(o => { const c = o.p.q * o.p.b; if (sum + c <= budget) { o.p.on = true; sum += c; } });
}

/* ---------- স্টক চলাচল ---------- */
async function addMove(h, pid, delta, kind, ref, ts, note) {
  const p = await h.get('products', pid);
  if (!p) throw new Error('পণ্য পাওয়া যায়নি');
  p.stock = sn((p.stock || 0) + delta);
  await h.put('products', p);
  await h.add('moves', { id: uid(), pid, delta: sn(delta), kind, ref: ref || '', ts, note: note || '', after: p.stock });
  return p;
}
async function adjustStock(d) { // {pid, newStock, reason, ts, rid}
  const p0 = byPid(d.pid); if (!p0) throw new Error('পণ্য পাওয়া যায়নি');
  const ns = num(d.newStock); if (!(ns >= 0 || ns < 0)) throw new Error('স্টকের সংখ্যা লিখুন');
  const ts = d.ts || Date.now();
  await run(['products', 'moves', 'meta', 'audit'], 'readwrite', async h => {
    const p = await h.get('products', d.pid);
    const delta = ns - (p.stock || 0);
    if (Math.abs(delta) < 1e-9) return;
    await addMove(h, d.pid, delta, d.opening ? 'open' : 'adj', 'adj', ts, d.reason || 'স্টক সংশোধন');
    await audit(h, 'স্টক সংশোধন', d.pid, p.name + ': ' + fmt(p.stock) + ' → ' + fmt(ns) + (d.reason ? ' (' + d.reason + ')' : ''));
    await bump(h);
  });
  await loadCache();
}

}

function balancesFrom(customers, sales, pays) {
  const b = {};
  customers.forEach(c => { b[c.id] = r2(c.opening || 0); });
  sales.forEach(s => { if (s.status === 'active' && s.cust && b[s.cust] != null) b[s.cust] = r2(b[s.cust] + s.total - s.paid); });
  pays.forEach(p => { if (p.status === 'active' && b[p.cust] != null) b[p.cust] = r2(b[p.cust] - p.amount); });
  return b;
}

async function customerStatement(cid) {

    c: await h.get('customers', cid), sales: await h.idx('sales', 'cust', cid), pays: await h.idx('payments', 'cust', cid)
  }));

  sales.forEach(s => rows.push({ ts: s.ts, kind: 'sale', ref: s, label: 'পণ্য নিয়েছে · ' + fmtNo(s.no), debit: s.total, credit: s.type === 'credit' || s.paid > 0 ? s.paid : 0, status: s.status }));

/* ---------- বিক্রি ---------- */
function calcLines(lines) {
  return lines.map(l => {
    const dq = num(l.dq), up = num(l.up);
    if (!(dq > 0)) throw new Error('"' + l.name + '" এর পরিমাণ ০ এর বেশি দিন');
    if (!(up >= 0)) throw new Error('"' + l.name + '" এর দাম লিখুন');
    return Object.assign({}, l, { dq: dq, up: up, qty: l.qty, total: r2(dq * up) });
  });
}
async function voidSaleTx(h, id, reason, replaced) {
  const s = await h.get('sales', id);
  if (!s) throw new Error('বিক্রির রেকর্ড পাওয়া যায়নি');
  if (s.status !== 'active') throw new Error('এই বিক্রি আগেই বাতিল হয়েছে');
  const now = Date.now();
  for (const l of s.lines) await addMove(h, l.pid, l.qty, 'void-sale', s.id, now, 'বিক্রি বাতিল ' + s.no);
  s.status = 'void'; s.voidTs = now; s.voidReason = reason || '';
  (s.hist = s.hist || []).push({ ts: now, act: replaced ? 'সংশোধন' : 'বাতিল', info: reason || '' });
  await h.put('sales', s);
  await audit(h, replaced ? 'বিক্রি সংশোধন' : 'বিক্রি বাতিল', s.id, s.no + ' · ' + money(s.total) + (reason ? ' · ' + reason : ''));
  return s;
}
async function saveSale(d) { // {rid,type,cust,lines,paid,ts,note,replaces}
  if (!d.lines || !d.lines.length) throw new Error('কমপক্ষে একটি পণ্য যোগ করুন');
  const lines = calcLines(d.lines);
  const total = r2(lines.reduce((a, l) => a + l.total, 0));
  if (d.type === 'credit' && !d.cust) throw new Error('বাকিতে বিক্রির জন্য ক্রেতা বেছে নিন');
  let paid = d.type === 'cash' ? total : r2(Math.min(Math.max(num(d.paid) || 0, 0), total));
  const ts = isFinite(d.ts) ? d.ts : Date.now();
  const res = await run(['sales', 'products', 'moves', 'customers', 'meta', 'audit'], 'readwrite', async h => {
    if (d.cust) { const c = await h.get('customers', d.cust); if (!c) throw new Error('ক্রেতা পাওয়া যায়নি'); }
    let oldNo = '';
    if (d.replaces) { const o = await voidSaleTx(h, d.replaces, 'সংশোধন: নতুন রসিদে বদলানো হয়েছে', true); oldNo = o.no; }
    const seq = await nextSeq(h, 'sale');
    const id = uid(), no = padNo('S', seq);
    const outLines = [];
    for (const l of lines) {
      const p = await h.get('products', l.pid);
      if (!p) throw new Error('পণ্য পাওয়া যায়নি: ' + l.name);
      const saleQty = num(l.qty);
      if (!(saleQty > 0)) throw new Error('"' + l.name + '" এর বিক্রির পরিমাণ সঠিক নয়');
      if ((p.stock || 0) + 0.0005 < saleQty) {
        throw new Error('"' + l.name + '" পর্যাপ্ত স্টক নেই। বর্তমান স্টক: ' + fmt(p.stock || 0) + ', বিক্রির পরিমাণ: ' + fmt(saleQty));
      }
      const cost = p.avg >= 0 && p.avg > 0 ? p.avg : (p.b || 0);
      outLines.push(Object.assign({}, l, { qty: saleQty, cost: r3(cost) }));
      await addMove(h, l.pid, -saleQty, 'sale', id, ts, no);
    }
    const sale = { id, rid: d.rid, no, ts, created: Date.now(), type: d.type, cust: d.cust || '', lines: outLines, total, paid, due: r2(total - paid), note: d.note || '', status: 'active', hist: [], replaces: d.replaces || '' };
    if (d.replaces) { sale.hist.push({ ts: Date.now(), act: 'সংশোধিত', info: 'আগের রসিদ ' + oldNo }); const o = await h.get('sales', d.replaces); o.replacedBy = id; await h.put('sales', o); }
    await h.add('sales', sale);
    await audit(h, d.type === 'cash' ? 'নগদ বিক্রি' : 'বাকি বিক্রি', id, no + ' · ' + money(total) + (d.type === 'credit' ? ' · বাকি ' + money(total - paid) : ''));
    await bump(h);
    return sale;
  });
  await loadCache(); return res;
}
async function voidSale(id, reason) {
  await run(['sales', 'products', 'moves', 'meta', 'audit'], 'readwrite', async h => { await voidSaleTx(h, id, reason, false); await bump(h); });
  await loadCache();
}

/* ---------- কেনাকাটা ---------- */
async function applyReceive(h, pur, ts) {
  for (const l of pur.lines) {
    const p = await h.get('products', l.pid); if (!p) throw new Error('পণ্য পাওয়া যায়নি: ' + l.name);
    const before = Math.max(p.stock || 0, 0), qty = l.qty;
    const avg = p.avg > 0 ? p.avg : (p.b || 0);
    p.avg = r3(before + qty > 0 ? (before * avg + qty * l.price) / (before + qty) : l.price);
    p.b = l.price; p.d = ts;
    if (l.exp) { if (!p.exp || (p.stock || 0) <= 0 || l.exp < p.exp) p.exp = l.exp; }
    await h.put('products', p);
    await addMove(h, l.pid, qty, 'buy', pur.id, ts, pur.no);
  }
}
function calcPurLines(lines) {
  return lines.map(l => {
    const qty = num(l.qty), price = num(l.price);
    if (!(qty > 0)) throw new Error('"' + l.name + '" এর পরিমাণ ০ এর বেশি দিন');
    if (!(price >= 0)) throw new Error('"' + l.name + '" এর কেনা দাম লিখুন');
    return Object.assign({}, l, { qty: qty, price: price, total: r2(qty * price), exp: l.exp || '' });
  });
}
async function savePurchase(d, receive) { // {id?,rid,supplier,phone,lines,paid,ts,note,replaces}
  if (!d.lines || !d.lines.length) throw new Error('কমপক্ষে একটি পণ্য যোগ করুন');
  const lines = calcPurLines(d.lines);
  const total = r2(lines.reduce((a, l) => a + l.total, 0));
  const ts = isFinite(d.ts) ? d.ts : Date.now();
  const paid = receive ? r2(Math.min(Math.max(num(d.paid) || 0, 0), total)) : 0;
  const res = await run(['purchases', 'products', 'moves', 'meta', 'audit'], 'readwrite', async h => {
    if (d.replaces) await voidPurchaseTx(h, d.replaces, 'সংশোধন: নতুন কেনাকাটায় বদলানো হয়েছে', true);
    let pur = d.id ? await h.get('purchases', d.id) : null;
    if (pur && pur.status !== 'draft') throw new Error('এই কেনাকাটা আর খসড়া নেই');
    const isNew = !pur;
    if (isNew) { const seq = await nextSeq(h, 'buy'); pur = { id: uid(), rid: d.rid, no: padNo('B', seq), created: Date.now(), hist: [], pays: [] }; }
    pur.ts = ts; pur.supplier = String(d.supplier || '').trim(); pur.phone = normPhone(d.phone); pur.note = d.note || '';
    pur.lines = lines; pur.total = total; pur.replaces = d.replaces || '';
    if (receive) {

    } else { pur.status = 'draft'; pur.paid = 0; pur.pays = []; }
    if (isNew) await h.add('purchases', pur); else await h.put('purchases', pur);
    if (d.replaces) { const o = await h.get('purchases', d.replaces); o.replacedBy = pur.id; await h.put('purchases', o); pur.hist.push({ ts: Date.now(), act: 'সংশোধিত', info: 'আগের নং ' + o.no }); await h.put('purchases', pur); }
    await audit(h, receive ? 'মাল গ্রহণ (কেনাকাটা)' : 'কেনার খসড়া সংরক্ষণ', pur.id, pur.no + ' · ' + money(total) + (pur.supplier ? ' · ' + pur.supplier : ''));
    await bump(h); return pur;
  });
  await loadCache(); return res;
}
async function voidPurchaseTx(h, id, reason, replaced) {
  const pur = await h.get('purchases', id);
  if (!pur) throw new Error('কেনাকাটা পাওয়া যায়নি');
  if (pur.status === 'void') throw new Error('আগেই বাতিল হয়েছে');
  const now = Date.now();
  if (pur.status === 'received') {
    const remaining = new Map();
    for (const l of pur.lines) {
      const p = await h.get('products', l.pid);
      if (!p) throw new Error('পণ্য পাওয়া যায়নি: ' + l.name);
      const available = remaining.has(l.pid) ? remaining.get(l.pid) : (p.stock || 0);
      if (available + 0.0005 < l.qty) throw new Error('"' + l.name + '" এর কেনা পরিমাণের সবটা এখন স্টকে নেই। বিক্রি/ব্যবহার হওয়া পরিমাণ আগে সমন্বয় না করে এই কেনাকাটা বাতিল করা যাবে না।');
      remaining.set(l.pid, available - l.qty);
    }
    for (const l of pur.lines) await addMove(h, l.pid, -l.qty, 'void-buy', pur.id, now, 'কেনা বাতিল ' + pur.no);
  }
  const was = pur.status;
  pur.status = 'void'; pur.voidTs = now; pur.voidReason = reason || '';
  (pur.hist = pur.hist || []).push({ ts: now, act: replaced ? 'সংশোধন' : 'বাতিল', info: reason || '' });
  await h.put('purchases', pur);
  await audit(h, replaced ? 'কেনাকাটা সংশোধন' : 'কেনাকাটা বাতিল', pur.id, pur.no + (was === 'draft' ? ' (খসড়া)' : '') + (reason ? ' · ' + reason : ''));
  return pur;
}
async function voidPurchase(id, reason) {
  await run(['purchases', 'products', 'moves', 'meta', 'audit'], 'readwrite', async h => { await voidPurchaseTx(h, id, reason, false); await bump(h); });
  await loadCache();
}
async function addPurchasePay(id, amount, ts) {
  amount = r2(num(amount)); if (!(amount > 0)) throw new Error('পরিমাণ ০ এর বেশি দিন');
  await run(['purchases', 'meta', 'audit'], 'readwrite', async h => {
    const p = await h.get('purchases', id); if (!p || p.status !== 'received') throw new Error('শুধু গ্রহণ করা কেনাকাটায় পরিশোধ যোগ হয়');
    if (r2(p.paid + amount) > p.total + 0.001) throw new Error('বাকির চেয়ে বেশি দেওয়া যাবে না (বাকি ' + money(p.total - p.paid) + ')');
    p.pays.push({ ts: isFinite(ts) ? ts : Date.now(), amt: amount }); p.paid = r2(p.paid + amount);
    (p.hist = p.hist || []).push({ ts: Date.now(), act: 'পরিশোধ', info: money(amount) });
    await h.put('purchases', p); await audit(h, 'সরবরাহকারীকে পরিশোধ', id, p.no + ' · ' + money(amount)); await bump(h);
  });
}

/* ---------- তারিখ-সময় সংশোধন (ইতিহাস রেখে) ---------- */
async function changeTs(store, id, newTs, reason) {
  if (!isFinite(newTs)) throw new Error('তারিখ ঠিক নয়');
  await run([store, 'moves', 'meta', 'audit'], 'readwrite', async h => {
    const d = await h.get(store, id); if (!d) throw new Error('রেকর্ড পাওয়া যায়নি');
    if (d.ts === newTs) return;
    const old = d.ts;
    (d.hist = d.hist || []).push({ ts: Date.now(), act: 'তারিখ বদল', info: fmtDT(old) + ' → ' + fmtDT(newTs) + (reason ? ' · ' + reason : '') });
    d.ts = newTs;
    if (store === 'purchases' && d.pays && d.pays.length && d.pays[0].ts === old) d.pays[0].ts = newTs;
    await h.put(store, d);
    const mv = await h.idx('moves', 'ref', id);
    for (const m of mv) { if (m.kind !== 'void-sale' && m.kind !== 'void-buy') { m.ts = newTs; await h.put('moves', m); } }
    await audit(h, 'তারিখ বদল', id, (d.no || '') + ': ' + fmtDT(old) + ' → ' + fmtDT(newTs)); await bump(h);
  });
}

/* ---------- রিপোর্টের হিসাব ---------- */
async function periodData(fromKey, toKeyExclusive) {
  const a = dayStart(fromKey), b = dayStart(toKeyExclusive), R = range(a, b);
  return run(['sales', 'payments', 'purchases', 'cash'], 'readonly', async h => ({
    sales: await h.idx('sales', 'ts', R), pays: await h.idx('payments', 'ts', R), purs: await h.idx('purchases', 'ts', R), cash: await h.idx('cash', 'ts', R),
    allPurs: await h.all('purchases')
  })).then(d => {
    const A = x => x.status === 'active';
    const sales = d.sales.filter(A), pays = d.pays.filter(A), cash = d.cash.filter(A), purs = d.purs.filter(x => x.status === 'received');
    const salesTotal = r2(sales.reduce((s, x) => s + x.total, 0));
    const cashAtSale = r2(sales.reduce((s, x) => s + x.paid, 0));
    const creditGiven = r2(salesTotal - cashAtSale);
    let cost = 0; const byProd = {};
    sales.forEach(s => s.lines.forEach(l => {
      const c = l.qty * (l.cost || 0); cost += c;
      const o = byProd[l.pid] || (byProd[l.pid] = { pid: l.pid, name: l.name, du: l.du, unit: l.baseUnit || '', qty: 0, total: 0, profit: 0, dqs: {} });
      o.qty = o.qty + l.qty; o.total = r2(o.total + l.total); o.profit = r2(o.profit + l.total - c);
      o.dqs[l.du] = r3((o.dqs[l.du] || 0) + l.dq);
    }));
    const grossProfit = r2(salesTotal - cost);
    const expenses = r2(cash.filter(x => x.kind === 'expense').reduce((s, x) => s + x.amount, 0));
    const cashIn = r2(cash.filter(x => x.kind === 'in').reduce((s, x) => s + x.amount, 0));
    const cashOut = r2(cash.filter(x => x.kind === 'out').reduce((s, x) => s + x.amount, 0));
    const collected = r2(pays.reduce((s, x) => s + x.amount, 0));
    const purTotal = r2(purs.reduce((s, x) => s + x.total, 0));
    let purPaid = 0;
    d.allPurs.filter(x => x.status === 'received').forEach(x => x.pays.forEach(p => { if (p.ts >= a && p.ts < b) purPaid += p.amt; }));
    purPaid = r2(purPaid);
    return {
      sales, pays, cash, purs, salesTotal, cashAtSale, creditGiven, grossProfit, expenses, cashIn, cashOut, collected, purTotal, purPaid,
      net: r2(grossProfit - expenses), cashNet: r2(cashAtSale + collected + cashIn - purPaid - expenses - cashOut),
      byProd: Object.values(byProd).sort((x, y) => y.total - x.total), count: sales.length
    };
  });
}
async function cashInHand() {
  const d = await run(['sales', 'payments', 'purchases', 'cash'], 'readonly', async h => ({ s: await h.all('sales'), p: await h.all('payments'), b: await h.all('purchases'), c: await h.all('cash') }));
  let v = C.settings.openingCash || 0;
  d.s.forEach(x => { if (x.status === 'active') v += x.paid; });
  d.p.forEach(x => { if (x.status === 'active') v += x.amount; });
  d.b.forEach(x => { if (x.status === 'received') x.pays.forEach(p => { v -= p.amt; }); });
  d.c.forEach(x => { if (x.status === 'active') v += x.kind === 'in' ? x.amount : -x.amount; });
  return r2(v);
}

  }));

function calcText(p) {
  const q = p.q, b = p.b, s = p.s;
  let t = 'কেনার মোট ' + money(r2(q * b));
  if (s > 0) { const rev = q * s, pf = rev - q * b; t += ' · বিক্রি হলে ' + money(r2(rev)) + ' · লাভ ' + money(r2(pf)) + (b > 0 ? ' (' + fmt(Math.round(pf / (q * b) * 1000) / 10) + '%)' : ''); }
  else t += ' · বিক্রি দাম বসালে লাভ দেখাবে';
  return t;
}
function pRowHTML(p, mode) { return '<div class="prow' + (p.on ? ' on' : '') + '" id="pr-' + p.id + '" data-id="' + p.id + '">' + pLineHTML(p, mode) + (PS.editing.has(p.id) ? pPanelHTML(p) : '') + '</div>'; }

function planTotals() {
  let total = 0, count = 0, rev = 0, revCost = 0, missing = 0; const cs = {};
  C.products.forEach(p => {
    if (!p.on) return; const c = p.q * p.b; total += c; count++;
    const x = cs[p.cat] || (cs[p.cat] = { s: 0, n: 0 }); x.s += c; x.n++;
    if (p.s > 0) { rev += p.q * p.s; revCost += c; } else missing++;
  });
  return { total: r2(total), count, rev, revCost, missing, cs };
}
function visibleProducts(mode) {
  const q = PS.q.trim().toLowerCase();
  return C.products.filter(p => {
    if (p.active === false && mode === 'plan') return false;
    if (q && (p.name + ' ' + p.cat + ' ' + (p.subcat || '') + ' ' + (p.brand || '')).toLowerCase().indexOf(q) === -1) return false;
    if (mode === 'plan') { if (PS.pri && p.pri !== PS.pri) return false; if (PS.onlySel && !p.on) return false; if (PS.noSell && p.s > 0) return false; }
    else { if (PS.cat && p.cat !== PS.cat) return false; if (PS.lowOnly && !(p.min > 0 && (p.stock || 0) <= p.min)) return false; }
    return true;
  });
}

    h += its.length ? (() => { const groups = {}; its.forEach(p => { const k = p.subcat || 'অন্যান্য'; (groups[k] = groups[k] || []).push(p); }); return Object.keys(groups).map(k => '<details class="subcat" open style="margin:6px 0 8px 10px;padding:7px;border-left:2px solid var(--line)"><summary style="font-weight:600;cursor:pointer;padding:4px">' + esc(k) + ' <span class="muted">(' + fmt(groups[k].length) + ')</span></summary>' + groups[k].map(p => pRowHTML(p, mode)).join('') + '</details>').join(''); })() : '<div class="empty small">এই ক্যাটাগরিতে কোনো পণ্য নেই।</div>';

  if (!C.cats.some(c => c.name === cat)) { C.cats.push({ name: cat, note: '' }); await saveCats(); }
  if (st > 0) await adjustStock({ pid: p.id, newStock: st, reason: 'শুরুর স্টক', opening: true });

}
async function commitField(t, mode) {
  const row = t.closest('.prow'); const p = byPid(row.dataset.id); const f = t.dataset.f; let recat = false;
  if (f === 'name') { const v = t.value.trim(); if (v) p.name = v; t.value = p.name; }
  else if (f === 'subcat') p.subcat = t.value.trim();
  else if (f === 'brand') p.brand = t.value.trim();
  else if (f === 'cat') { p.cat = t.value; recat = true; }
  else if (f === 'unit') { const v = t.value.trim(); if (v) { p.unit = v; if (!p.alt) p.alt = defaultAlt(v); } t.value = p.unit; recat = true; }
  else if (f === 'pri') p.pri = +t.value;
  else if (f === 'q') { const v = num(t.value); if (v > 0) p.q = v; t.value = plain(p.q); }
  else if (f === 'b') { const v = num(t.value); if (v >= 0) { p.b = v; p.d = Date.now(); if (!(p.stock > 0)) p.avg = v; } t.value = plain(p.b); }
  else if (f === 's') { const v = num(t.value); p.s = v > 0 ? v : 0; p.d = Date.now(); }
  else if (f === 'pct') { const v = num(t.value); if (isFinite(v) && p.b > 0) { p.s = Math.max(0, r2(p.b * (1 + v / 100))); p.d = Date.now(); } }
  else if (f === 'min') { const v = num(t.value); p.min = v > 0 ? v : 0; }
  else if (f === 'exp') p.exp = t.value || '';
  else if (f === 'altu' || f === 'altper') {
    const u = $('[data-f="altu"]', row).value.trim(), per = num($('[data-f="altper"]', row).value);
    p.alt = u && per > 0 ? { u, per } : null; recat = true;
  }
  await putProduct(p);
  if (recat) { await loadCache(); return 'full'; }
  return p;
}
function paintRow(p, mode) {

  const c = $('[data-calc]', el); if (c) c.textContent = calcText(p);
  ['s', 'pct', 'b', 'q'].forEach(f => { const e = $('[data-f="' + f + '"]', el); if (e && document.activeElement !== e) { e.value = f === 'pct' ? (pctOf(p) ? plain(pctOf(p)) : '') : f === 's' ? (p.s > 0 ? plain(p.s) : '') : plain(p[f]); } });
}

      $('[data-calc]', pnl).textContent = calcText({ q: isFinite(q) ? q : 0, b: isFinite(b) ? b : 0, s: isFinite(s) ? s : 0 });

    const rows = C.products.filter(p => p.cat === c.name && p.on && p.active !== false); if (!rows.length) return;
    t += '\n' + c.name + '\n';
    rows.forEach(p => { const g = r2(p.q * p.b); tot += g; if (p.s > 0) { rev += p.q * p.s; rc += g; } t += '- ' + p.name + ': ' + fmt(p.q) + ' ' + p.unit + ' × ৳' + fmt(p.b) + ' = ৳' + fmt(g) + '\n'; });
  });
  t += '\nমোট কেনা: ৳' + fmt(r2(tot)) + ' (বাজেট ৳' + fmt(C.settings.budget) + ')';
  if (rev > 0) t += '\nপ্রত্যাশিত বিক্রি: ৳' + fmt(r2(rev)) + ', লাভ: ৳' + fmt(r2(rev - rc));
  return t;
}

/* ---------- কেনার তালিকার PDF/প্রিন্ট পাতা ---------- */
function purchaseDocHTML(pur) {
  const S = C.settings, by = {};
  pur.lines.forEach(l => { (by[l.cat || 'অন্যান্য'] = by[l.cat || 'অন্যান্য'] || []).push(l); });
  const order = C.cats.map(c => c.name).concat(Object.keys(by).filter(k => !C.cats.some(c => c.name === k)));
  const hasExp = pur.lines.some(l => l.exp);

  order.forEach(cn => {

    by[cn].forEach(l => { n++; rows += '<tr><td>' + fmt(n) + '</td><td>' + esc(l.name) + '</td><td class="n">' + fmt(l.qty) + '</td><td>' + esc(l.unit) + '</td><td class="n">' + fmt(l.price) + '</td><td class="n">' + fmt(r2(l.qty * l.price)) + '</td>' + (hasExp ? '<td>' + (l.exp ? fmtKey(l.exp) : '') + '</td>' : '') + '</tr>'; });

    '<tr class="grand"><td colspan="5" class="n">সর্বমোট (' + fmt(pur.lines.length) + 'টি পণ্য)</td><td class="n">' + fmt(total) + '</td>' + (hasExp ? '<td></td>' : '') + '</tr>' +
    (pur.status === 'received' ? '<tr><td colspan="5" class="n">পরিশোধ</td><td class="n">' + fmt(pur.paid || 0) + '</td>' + (hasExp ? '<td></td>' : '') + '</tr><tr><td colspan="5" class="n">বাকি (সরবরাহকারীকে)</td><td class="n">' + fmt(r2(total - (pur.paid || 0))) + '</td>' + (hasExp ? '<td></td>' : '') + '</tr>' : '') +
    '</tbody></table>' + (pur.note ? '<div>নোট: ' + esc(pur.note) + '</div>' : '') + '</div>';
}

const MOVE_LABEL = { buy: 'মাল কেনা', sale: 'বিক্রি', 'void-sale': 'বিক্রি বাতিল (ফেরত)', 'void-buy': 'কেনা বাতিল', adj: 'স্টক সংশোধন', open: 'শুরুর স্টক' };

/* ---------- স্টক ---------- */
const STK = { q: '', tab: 'all' };
PAGES.stock = async function () {

  const low = lowList().length, exp = inv.filter(p => { const e = expiryState(p); return e && e.cls !== 'green' && (p.stock || 0) > 0; }).length, neg = inv.filter(p => (p.stock || 0) < 0).length, zero = inv.filter(p => (p.stock || 0) === 0).length;
  const tabs = [['all', 'সব'], ['low', 'শেষ হচ্ছে (' + fmt(low) + ')'], ['exp', 'মেয়াদ (' + fmt(exp) + ')'], ['zero', 'স্টক নেই (' + fmt(zero) + ')'], ['neg', 'মাইনাস (' + fmt(neg) + ')'], ['bulk', 'দ্রুত স্টক বসান']];

    '<div class="tabs">' + tabs.map(t => '<button type="button" class="chip" data-tab="' + t[0] + '" aria-pressed="' + (STK.tab === t[0]) + '">' + t[1] + '</button>').join('') + '</div>' +
    '<input type="search" id="q" placeholder="পণ্য খুঁজুন" value="' + esc(STK.q) + '" aria-label="পণ্য খুঁজুন"><div id="stk" style="margin-top:8px"></div>';
  const paint = () => {
    const q = STK.q.trim().toLowerCase(); let list = inv.filter(p => !q || (p.name + ' ' + p.cat).toLowerCase().indexOf(q) > -1);

        '<div class="list">' + list.slice(0, 120).map(p => '<div class="item"><div><div class="t">' + esc(p.name) + '</div><div class="s">এখন ' + esc(stockText(p)) + '</div></div><div><input type="text" inputmode="decimal" data-bulk="' + p.id + '" placeholder="' + esc(p.unit) + '" style="width:7em;text-align:right"></div></div>').join('') + '</div>' +
        (list.length > 120 ? '<div class="small muted">প্রথম ১২০টি দেখানো হলো, খুঁজে বাকিগুলো বের করুন।</div>' : '') + '<div class="msg" id="bk-m"></div><div class="row" style="margin-top:8px"><button class="btn primary" data-a="bulksave" type="button">স্টক সংরক্ষণ করুন</button></div>';
      return;
    }
    list.sort((a, b) => (a.stock || 0) - (b.stock || 0) || a.name.localeCompare(b.name, 'bn'));
    $('#stk').innerHTML = list.length ? '<div class="list">' + list.slice(0, 200).map(p => { const e = expiryState(p); return '<div class="item" data-id="' + p.id + '" style="cursor:pointer"><div><div class="t">' + esc(p.name) + (p.min > 0 && (p.stock || 0) <= p.min ? ' <span class="tag red">স্টক কম</span>' : '') + (e && e.t ? ' <span class="tag ' + e.cls + '">' + e.t + '</span>' : '') + ((p.stock || 0) < 0 ? ' <span class="tag red">মাইনাস</span>' : '') + '</div><div class="s">' + esc(p.cat) + (p.min > 0 ? ' · সতর্কতা ' + fmt(p.min) : '') + (p.exp ? ' · মেয়াদ ' + fmtKey(p.exp) : '') + '</div></div><div class="r">' + esc(stockText(p)) + '</div></div>'; }).join('') + '</div>' + (list.length > 200 ? '<div class="small muted">প্রথম ২০০টি দেখানো হলো।</div>' : '') : '<div class="empty">কিছু পাওয়া যায়নি।</div>';

      '<label class="f full">তারিখ ও সময়' + (F.tsAuto ? ' (এখনকার সময় অটো বসবে)' : '') + '<input type="datetime-local" id="p-t" value="' + toLocalInput(F.ts) + '"></label><label class="f full">নোট (ঐচ্ছিক)<input type="text" id="p-n" value="' + esc(keep.note) + '"></label></div>' +

    }
  });

}

function normKey(k) { return String(k).replace(/\s|\(.*?\)|[().:]/g, '').toLowerCase(); }
function pickVal(o, starts) {
  const keys = Object.keys(o);
  for (const k0 of keys) {
    const k = normKey(k0); if (k.indexOf('মোট') === 0 || k.indexOf('total') === 0) continue;
    for (const s of starts) if (k.indexOf(s) === 0) return o[k0];
  }
  return undefined;
}
function parsePri(v) {
  if (v === undefined || v === '') return 0; const t = String(v).trim();
  if (t.indexOf('জরুরি') === 0) return 1; if (t.indexOf('নিয়মিত') === 0) return 2; if (t.indexOf('ঐচ্ছিক') === 0) return 3;
  const n = Math.round(num(t)); return n >= 1 && n <= 3 ? n : 0;
}
async function applyRows(rows, mode) {
  await takeSnapshot('ইমপোর্টের আগের অবস্থা');
  let added = 0, updated = 0, skipped = 0;
  await run(['products', 'moves', 'meta', 'audit'], 'readwrite', async h => {
    let cur = await h.all('products');
    if (mode === 'replace') { if ((await h.count('moves')) > 0) throw new Error('লেনদেন থাকলে "সব বদলে ফেলুন" করা যায় না। "যোগ/আপডেট" বেছে নিন।'); await h.clear('products'); cur = []; }
    const idx = new Map(cur.map(p => [p.cat + '||' + p.name, p])); const cats = (await h.get('meta', 'cats')) || { k: 'cats', v: [] }; const have = new Set(cats.v.map(c => c.name));
    let ord = Date.now();
    for (const o of rows) {
      const name = String(pickVal(o, ['পণ্য', 'নাম', 'item', 'name', 'product']) || '').trim(); if (!name) { skipped++; continue; }
      const cat = String(pickVal(o, ['ক্যাটাগরি', 'category', 'cat']) || '').trim() || 'অন্যান্য';
      const q = num(pickVal(o, ['পরিমাণ', 'qty', 'quantity'])), u = String(pickVal(o, ['একক', 'unit']) || '').trim();
      const b = num(pickVal(o, ['কেনা', 'ক্রয়', 'buy', 'cost'])), s = num(pickVal(o, ['বিক্রি', 'sell', 'sale'])), pri = parsePri(pickVal(o, ['অগ্রাধিকার', 'priority', 'pri']));
      const onv = pickVal(o, ['কিনব', 'সিলেক্ট', 'select']); let on = null; if (onv !== undefined && onv !== '') on = ['হ্যাঁ', 'হ্যা', 'yes', 'y', '1', 'true', 'x', '✓'].indexOf(String(onv).trim().toLowerCase()) > -1;
      const stk = num(pickVal(o, ['স্টক', 'stock']));
      let p = idx.get(cat + '||' + name);
      if (p) {
        if (q > 0) p.q = q; if (u) p.unit = u; if (b >= 0) { p.b = b; if (!(p.stock > 0)) p.avg = b; } if (isFinite(s)) p.s = s > 0 ? s : 0; if (pri) p.pri = pri; if (on !== null) p.on = on;
        await h.put('products', p); updated++;
      } else {
        p = newProduct({ name, cat, q: q > 0 ? q : 1, unit: u || 'পিস', b: b >= 0 ? b : 0, s: s > 0 ? s : 0, pri: pri || 2, on: on === true, ord: ord++ });
        await h.put('products', p); idx.set(cat + '||' + name, p); added++;
        if (stk > 0) await addMove(h, p.id, stk, 'open', 'import', Date.now(), 'ইমপোর্ট থেকে শুরুর স্টক');
      }
      if (!have.has(cat)) { cats.v.push({ name: cat, note: '' }); have.add(cat); }
    }
    await h.put('meta', cats); await audit(h, 'Excel/CSV ইমপোর্ট', '', fmt(added) + 'টি নতুন, ' + fmt(updated) + 'টি আপডেট'); await bump(h);
  });
  await loadCache(); return { added, updated, skipped };
}

    '<h2>ℹ️ অ্যাপ</h2><div class="card small"><div>সংস্করণ ' + fmt(APP_VER) + ' · সময় অঞ্চল: ঢাকা (UTC+6)</div><div>' + esc(est) + '</div><div>' + esc(pers) + '</div><div>' + (navigator.serviceWorker && navigator.serviceWorker.controller ? '✅ অফলাইন চালু (ইন্টারনেট ছাড়াই খুলবে)' : 'অফলাইনে খোলার সুবিধা এখনো চালু হয়নি। ইন্টারনেট থাকা অবস্থায় একবার অ্যাপটা খুলে রাখুন') + '</div>' + (window.__installEv ? '<div style="margin-top:8px"><button class="btn primary" data-a="install" type="button">📲 হোম স্ক্রিনে অ্যাপ হিসেবে যোগ করুন</button></div>' : '<div class="muted">হোম স্ক্রিনে যোগ করতে: Chrome-এর মেনু (⋮) → "হোম স্ক্রিনে যোগ করুন"/"Install app"।</div>') + '</div>';
  VH.click = async e => {
    const b = e.target.closest('button'); if (!b || !b.dataset.a) return; const a = b.dataset.a;
    try {
      if (a === 'bk') doBackup(false); else if (a === 'bks') doBackup(true); else if (a === 'xl') exportExcel(); else if (a === 'imp') openImportSheet(() => show());
      else if (a === 'install') { const ev = window.__installEv; if (ev) { ev.prompt(); await ev.userChoice; window.__installEv = null; show(); } }
      else if (a === 'save') {
        const patch = { shopName: $('#s-name').value.trim() || DEFAULT_SETTINGS.shopName, shopPhone: normPhone($('#s-ph').value), shopAddress: $('#s-ad').value.trim(), receiptFooter: $('#s-ft').value.trim(), expiryDays: Math.max(1, Math.round(num($('#s-ex').value) || 30)), backupRemindDays: Math.max(1, Math.round(num($('#s-bk').value) || 7)), openingCash: isFinite(num($('#s-oc').value)) ? r2(num($('#s-oc').value)) : 0, theme: $('#s-th').value };
        await saveSettings(patch); applyTheme(); $('#shopName').textContent = C.settings.shopName; const m = $('#set-m'); m.className = 'msg ok'; m.textContent = 'সংরক্ষিত হয়েছে';
      }
      else if (a === 'chk') { const bad = await stockCheck(); const r = $('#chk-r'); if (!bad.length) { r.innerHTML = '<div class="banner ok">✅ সব পণ্যের স্টক চলাচলের খাতার সাথে মিলছে।</div>'; } else { r.innerHTML = '<div class="banner err">' + fmt(bad.length) + 'টি পণ্যের স্টক মিলছে না:</div><div class="list">' + bad.slice(0, 30).map(x => '<div class="item"><div class="t">' + esc(x.p.name) + '</div><div class="r">দেখাচ্ছে ' + fmt(x.p.stock || 0) + ' · খাতায় ' + fmt(x.calc) + '</div></div>').join('') + '</div><button class="btn primary" data-a="fix" type="button" style="margin-top:8px">খাতা অনুযায়ী ঠিক করুন</button>'; r._bad = bad; } }
      else if (a === 'fix') { const bad = $('#chk-r')._bad; await stockFix(bad); toast('স্টক ঠিক করা হয়েছে'); show(); }
      else if (a === 'snap') { const sn = snaps.find(x => x.id === b.dataset.id); const ok = await confirmSheet('আগের অবস্থায় ফেরা', '"' + sn.label + '" (' + fmtDT(sn.ts) + ') এর সময়ের অবস্থায় ফিরবেন? এখনকার অবস্থার কপিও রাখা হবে।', 'হ্যাঁ, ফিরুন', true); if (ok) { await restoreData(sn.snap, 'ফেরার আগের অবস্থা'); toast('আগের অবস্থায় ফেরা হয়েছে'); show(); } }
      else if (a === 'aud') { const l = (await run(['audit'], 'readonly', h => h.all('audit'))).sort((x, y) => y.ts - x.ts).slice(0, 100); $('#aud').innerHTML = '<div class="list">' + l.map(x => '<div class="item"><div><div class="t">' + esc(x.act) + '</div><div class="s">' + esc(x.info || '') + '</div></div><div class="s">' + fmtDT(x.ts) + '</div></div>').join('') + '</div>'; }
      else if (a === 'reset') { const ok = await confirmSheet('মূল তালিকায় ফিরে যান', 'মূল তালিকার পণ্যের দাম, পরিমাণ ও সিলেকশন আগের অবস্থায় যাবে। স্টক, লেনদেন, ক্রেতা অক্ষত থাকবে। এগোবেন?', 'হ্যাঁ, ফিরে যান', true); if (ok) { await resetToSeed(); toast('মূল তালিকা ফিরে এসেছে'); show(); } }
    } catch (er) { toast(errText(er)); }
  };
};

/* =====================================================================
   অ্যাপ চালু করা, অফলাইন (Service Worker), ইনস্টল
   ===================================================================== */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installEv = e; });
window.addEventListener('appinstalled', () => { window.__installEv = null; });
function netBar() { const b = $('#offlineBar'); if (b) b.classList.toggle('on', !navigator.onLine); }
window.addEventListener('online', netBar); window.addEventListener('offline', netBar);

async function boot() {
  netBar();
  try {
    await openDB();
  } catch (e) {
    $('#view').innerHTML = '<div class="banner err"><b>ডেটাবেস চালু করা যায়নি।</b><br>' + esc(errText(e)) + '<br>প্রাইভেট/ইনকগনিটো ট্যাবে নয়, সাধারণ Chrome-এ খুলুন।</div>';
    return;
  }
  let first = null;
  try { first = await firstRun(); } catch (e) { console.error(e); $('#view').innerHTML = '<div class="banner err">প্রথমবার চালু করতে সমস্যা: ' + esc(errText(e)) + '</div>'; return; }
  if (first && first.info) window.__firstInfo = first.info;
  await loadCache(); await ensureCatalogExpansion(); await loadCache(); applyTheme();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  bindView();
  if (!location.hash) location.replace('#/dash');
  await show();
  if (first && first.how === 'legacy') setTimeout(() => toast('পুরোনো অ্যাপের ডেটা নিরাপদে আনা হয়েছে'), 600);
  registerSW();
}
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
boot();

</script>
